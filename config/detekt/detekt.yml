build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  checkExhaustiveness: false
  warningsAsErrors: false

processors:
  active: true

console-reports:
  active: true

naming:
  FunctionNaming:
    active: true
    functionPattern: '[A-Za-z][a-zA-Z0-9]*'
    excludeClassPattern: '$^'
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'

complexity:
  LongMethod:
    threshold: 40
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
  CyclomaticComplexMethod:
    threshold: 15
  TooManyFunctions:
    thresholdInFiles: 25
    thresholdInClasses: 25
    thresholdInInterfaces: 25
    thresholdInObjects: 25
    thresholdInEnums: 25

exceptions:
  TooGenericExceptionCaught:
    active: false
  TooGenericExceptionThrown:
    active: false
  SwallowedException:
    active: false

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 3
